name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    name: "Build + checks (Docker)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage 1+2 of the Dockerfile compile Tailwind CSS, install Python deps,
      # run collectstatic, and run `manage.py check` — so this validates the
      # whole build inside a reproducible container.
      - name: "Build Docker image (target app)"
        run: docker build --target app -t studybud:ci .

      - name: Django system check
        run: docker run --rm studybud:ci python manage.py check

  deploy:
    name: "Deploy to Vercel"
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Compile Tailwind here so the fresh `static/css/tailwind.css` is uploaded
      # with the deploy. It's gitignored, but the Vercel CLI uploads files from
      # disk (it uses .vercelignore, not .gitignore).
      - name: Build Tailwind CSS
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Requires GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
      - name: "Deploy to Vercel (production)"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --yes --token=$VERCEL_TOKEN
