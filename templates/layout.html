<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
        <title>StudyBuddy - Find study partners around the world!</title>
    </head>

    <body class="flex min-h-dvh flex-col bg-bg font-sans text-light-gray antialiased">
        {% include 'navbar.html'%}

        {% if messages %}
        <ul class="fixed top-4 right-4 z-50 flex flex-col gap-2">
            {% for message in messages %}
            <li class="rounded-lg bg-dark-medium px-4 py-3 text-light shadow-lg">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}
        {% endblock %}

        <script src="{% static "js/script.js" %}"></script>

    </body>
</html>
